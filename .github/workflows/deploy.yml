name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds the site and pushes dist/ to the gh-pages branch. GitHub serves
# Pages from that branch (auto-enabled the first time the branch appears).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
